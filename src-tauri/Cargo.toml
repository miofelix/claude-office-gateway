[package]
name = "claude-office-gateway"
version = "0.1.0"
description = "A private local gateway for Claude Office add-ins"
authors = ["Mio Felix"]
license = "MIT"
edition = "2021"
rust-version = "1.88.0"

[lib]
name = "claude_office_gateway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
anyhow = "1"
arboard = "3.6"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
keyring = { version = "3.6", features = ["apple-native", "windows-native"] }
log = "0.4"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.8", features = ["tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
futures-util = "0.3"
async-stream = "0.3"
bytes = "1"
sha1 = "0.10"
time = "0.3"
rustls = "0.23"
tower = { version = "0.5", features = ["util", "limit"] }
http-body-util = "0.1"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_Shell"] }

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "s"
strip = "symbols"


[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tokio-stream = "0.1"
